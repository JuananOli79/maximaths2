<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MaxiMaths">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>MaxiMaths</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    :root {
      --blue:   #4A90E2;
      --green:  #27AE60;
      --yellow: #F1C40F;
      --red:    #E74C3C;
      --purple: #9B59B6;
      --bg:     #1A1A2E;
      --card:   #16213E;
      --text:   #FFFFFF;
      --sub:    #A0AEC0;
    }

    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      font-family: -apple-system, 'Helvetica Neue', sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    /* ── SCREENS ── */
    .screen {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 24px;
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .screen.active { opacity: 1; pointer-events: all; }

    /* ── MENU ── */
    #menu { gap: 28px; }

    .logo {
      font-size: 56px; font-weight: 900;
      background: linear-gradient(135deg, #4A90E2, #9B59B6);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      letter-spacing: -2px;
    }
    .logo-sub { font-size: 18px; color: var(--sub); margin-top: -8px; }

    .section-title {
      font-size: 15px; font-weight: 700; letter-spacing: 1.5px;
      text-transform: uppercase; color: var(--sub);
      align-self: flex-start; width: 100%; max-width: 480px;
    }

    /* Operation selector */
    .ops-grid {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 12px; width: 100%; max-width: 480px;
    }
    .ops-grid.two-col { grid-template-columns: repeat(2, 1fr); }

    .op-btn {
      padding: 18px 8px; border-radius: 18px; border: 3px solid transparent;
      font-size: 28px; font-weight: 800; cursor: pointer;
      background: var(--card); color: var(--text);
      transition: all 0.15s ease; user-select: none;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    .op-btn span { font-size: 12px; font-weight: 600; letter-spacing: 0.5px; }
    .op-btn.selected { border-color: var(--yellow); background: rgba(241,196,15,0.15); transform: scale(1.05); }
    .op-btn:active { transform: scale(0.95); }

    /* Difficulty */
    .diff-grid {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 12px; width: 100%; max-width: 480px;
    }
    .diff-btn {
      padding: 16px 8px; border-radius: 18px; border: 3px solid transparent;
      font-size: 14px; font-weight: 700; cursor: pointer;
      background: var(--card); color: var(--text);
      transition: all 0.15s ease; user-select: none;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
    }
    .diff-btn .diff-icon { font-size: 26px; }
    .diff-btn.selected { border-color: var(--blue); background: rgba(74,144,226,0.15); transform: scale(1.05); }
    .diff-btn:active { transform: scale(0.95); }

    /* Start button */
    .start-btn {
      width: 100%; max-width: 480px; padding: 22px;
      border-radius: 20px; border: none; cursor: pointer;
      background: linear-gradient(135deg, #4A90E2, #9B59B6);
      color: white; font-size: 22px; font-weight: 800;
      letter-spacing: 0.5px;
      transition: all 0.15s ease; user-select: none;
      box-shadow: 0 8px 24px rgba(74,144,226,0.4);
    }
    .start-btn:active { transform: scale(0.97); box-shadow: none; }
    .start-btn:disabled { opacity: 0.4; cursor: default; }

    /* ── GAME ── */
    #game { gap: 20px; justify-content: flex-start; padding-top: 40px; }

    /* Header bar */
    .game-header {
      width: 100%; max-width: 520px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .back-btn {
      width: 44px; height: 44px; border-radius: 12px;
      background: var(--card); border: none; color: var(--sub);
      font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .progress-wrap { flex: 1; margin: 0 16px; }
    .progress-bar {
      height: 10px; border-radius: 99px; background: var(--card);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%; border-radius: 99px;
      background: linear-gradient(90deg, #4A90E2, #9B59B6);
      transition: width 0.4s ease;
    }
    .progress-text { font-size: 13px; color: var(--sub); text-align: right; margin-top: 4px; }

    .score-badge {
      background: linear-gradient(135deg, #F1C40F, #E67E22);
      color: #1A1A2E; font-size: 16px; font-weight: 800;
      padding: 8px 14px; border-radius: 12px;
    }

    /* Question card */
    .question-card {
      width: 100%; max-width: 520px;
      background: var(--card); border-radius: 28px;
      padding: 28px 24px 24px;
      display: flex; flex-direction: column; align-items: center; gap: 14px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.3);
    }
    .streak-row { font-size: 22px; min-height: 28px; letter-spacing: 2px; }
    .feedback-msg { font-size: 22px; font-weight: 700; min-height: 30px; }

    /* ── VERTICAL PROBLEM: +, -, ×, ÷ ── */
    .v-problem {
      display: inline-flex;
      flex-direction: column;
      align-items: stretch;
      min-width: 140px;
    }
    .v-row {
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }
    .v-spacer { min-width: 40px; flex-shrink: 0; }
    .v-sym {
      min-width: 40px; flex-shrink: 0;
      font-size: clamp(26px, 5.5vw, 40px); font-weight: 900;
      color: var(--blue); text-align: left; line-height: 1;
    }
    .v-num {
      font-size: clamp(34px, 7vw, 52px); font-weight: 900;
      text-align: right; min-width: 72px; line-height: 1.15;
    }
    .v-hline {
      width: 100%; height: 4px;
      background: rgba(255,255,255,0.35);
      border-radius: 3px;
      margin: 8px 0 6px;
    }

    /* Answer box */
    .answer-display {
      min-width: 72px; min-height: 52px;
      background: rgba(255,255,255,0.07); border-radius: 14px;
      font-size: clamp(28px, 6vw, 42px); font-weight: 800; text-align: center;
      padding: 4px 14px; color: var(--yellow);
      border: 3px solid rgba(255,255,255,0.1);
      transition: border-color 0.2s;
      display: flex; align-items: center; justify-content: center;
    }
    .answer-display.correct { border-color: var(--green); color: var(--green); animation: pop 0.3s ease; }
    .answer-display.wrong   { border-color: var(--red);   color: var(--red);   animation: shake 0.4s ease; }

    /* Numpad */
    .numpad {
      width: 100%; max-width: 520px;
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .num-btn {
      padding: 0; height: 76px; border-radius: 18px;
      border: none; cursor: pointer;
      background: var(--card); color: var(--text);
      font-size: 30px; font-weight: 700;
      transition: all 0.1s ease; user-select: none;
      box-shadow: 0 4px 0 rgba(0,0,0,0.3);
    }
    .num-btn:active { transform: translateY(4px); box-shadow: none; }
    .num-btn.del    { background: #2C3E50; font-size: 26px; }
    .num-btn.ok     {
      background: linear-gradient(135deg, #27AE60, #1E8449);
      font-size: 28px;
      box-shadow: 0 4px 0 #145A32;
    }
    .num-btn.ok:active { box-shadow: none; }
    .num-btn:disabled { opacity: 0.4; }

    /* ── RESULTS ── */
    #results { gap: 20px; }

    .result-card {
      width: 100%; max-width: 480px;
      background: var(--card); border-radius: 28px;
      padding: 40px 32px; text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.3);
    }
    .result-emoji { font-size: 72px; margin-bottom: 8px; }
    .result-title { font-size: 32px; font-weight: 900; margin-bottom: 4px; }
    .result-sub   { font-size: 16px; color: var(--sub); margin-bottom: 24px; }
    .result-score { font-size: 56px; font-weight: 900; color: var(--yellow); }
    .result-score small { font-size: 20px; color: var(--sub); font-weight: 600; }
    .stars-row    { font-size: 44px; margin: 8px 0 16px; letter-spacing: 4px; }

    .stat-row {
      display: flex; justify-content: space-around;
      background: rgba(255,255,255,0.05); border-radius: 16px;
      padding: 16px; margin-top: 8px;
    }
    .stat { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .stat strong { font-size: 24px; font-weight: 800; }
    .stat span   { font-size: 12px; color: var(--sub); text-transform: uppercase; letter-spacing: 0.5px; }

    .btn-row { display: flex; gap: 12px; width: 100%; max-width: 480px; }
    .action-btn {
      flex: 1; padding: 20px; border-radius: 20px; border: none;
      font-size: 18px; font-weight: 800; cursor: pointer;
      transition: all 0.15s ease; user-select: none;
    }
    .action-btn:active { transform: scale(0.97); }
    .action-btn.primary {
      background: linear-gradient(135deg, #4A90E2, #9B59B6);
      color: white; box-shadow: 0 6px 20px rgba(74,144,226,0.4);
    }
    .action-btn.secondary { background: var(--card); color: var(--text); }

    /* ── ANIMATIONS ── */
    @keyframes pop   { 0%,100%{transform:scale(1)} 50%{transform:scale(1.12)} }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
    @keyframes floatUp {
      0%   { opacity:1; transform:translateY(0) scale(1); }
      100% { opacity:0; transform:translateY(-80px) scale(1.3); }
    }
    .float-pts {
      position: fixed; font-size: 28px; font-weight: 900; pointer-events: none;
      animation: floatUp 0.8s ease forwards; color: var(--yellow);
    }
    .confetti-piece {
      position: fixed; width: 10px; height: 10px;
      border-radius: 2px; pointer-events: none;
      animation: confettiFall linear forwards;
    }
    @keyframes confettiFall {
      0%   { transform: translateY(-20px) rotate(0deg);   opacity: 1; }
      100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }
  </style>
</head>
<body>

<!-- ══════════════ MENU ══════════════ -->
<div class="screen active" id="menu">
  <div class="logo">MaxiMaths</div>
  <div class="logo-sub">¡Aprende a calcular!</div>

  <div class="section-title" style="margin-top:8px">Elige la operación</div>
  <div class="ops-grid">
    <button class="op-btn selected" data-op="+" onclick="selectOp(this,'+')">＋<span>Suma</span></button>
    <button class="op-btn" data-op="-" onclick="selectOp(this,'-')">−<span>Resta</span></button>
    <button class="op-btn" data-op="*" onclick="selectOp(this,'*')">×<span>Multip.</span></button>
    <button class="op-btn" data-op="/" onclick="selectOp(this,'/')">÷<span>División</span></button>
  </div>
  <div class="ops-grid two-col">
    <button class="op-btn" data-op="mix"  onclick="selectOp(this,'mix')">🎲<span>Mezclado</span></button>
    <button class="op-btn" data-op="mix2" onclick="selectOp(this,'mix2')">➕➖<span>Suma y Resta</span></button>
  </div>

  <div class="section-title">Dificultad</div>
  <div class="diff-grid">
    <button class="diff-btn selected" data-diff="easy"   onclick="selectDiff(this,'easy')">
      <span class="diff-icon">🌱</span>Fácil<small style="color:var(--sub);font-size:11px">Hasta 10</small>
    </button>
    <button class="diff-btn" data-diff="medium" onclick="selectDiff(this,'medium')">
      <span class="diff-icon">🔥</span>Medio<small style="color:var(--sub);font-size:11px">Hasta 20</small>
    </button>
    <button class="diff-btn" data-diff="hard"   onclick="selectDiff(this,'hard')">
      <span class="diff-icon">⚡️</span>Difícil<small style="color:var(--sub);font-size:11px">Hasta 50</small>
    </button>
  </div>

  <button class="start-btn" onclick="startGame()">¡Jugar! 🚀</button>
</div>

<!-- ══════════════ GAME ══════════════ -->
<div class="screen" id="game">
  <div class="game-header">
    <button class="back-btn" onclick="goMenu()">‹</button>
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      <div class="progress-text" id="progressText">1 / 10</div>
    </div>
    <div class="score-badge" id="scoreBadge">⭐ 0</div>
  </div>

  <div class="question-card">
    <div class="streak-row" id="streakRow"></div>
    <div id="problemContainer"></div>
    <div class="feedback-msg" id="feedbackMsg"></div>
  </div>

  <div class="numpad">
    <button class="num-btn" onclick="numPress('7')">7</button>
    <button class="num-btn" onclick="numPress('8')">8</button>
    <button class="num-btn" onclick="numPress('9')">9</button>
    <button class="num-btn" onclick="numPress('4')">4</button>
    <button class="num-btn" onclick="numPress('5')">5</button>
    <button class="num-btn" onclick="numPress('6')">6</button>
    <button class="num-btn" onclick="numPress('1')">1</button>
    <button class="num-btn" onclick="numPress('2')">2</button>
    <button class="num-btn" onclick="numPress('3')">3</button>
    <button class="num-btn del" onclick="numDel()">⌫</button>
    <button class="num-btn" onclick="numPress('0')">0</button>
    <button class="num-btn ok" id="okBtn" onclick="checkAnswer()">✓</button>
  </div>
</div>

<!-- ══════════════ RESULTS ══════════════ -->
<div class="screen" id="results">
  <div class="result-card">
    <div class="result-emoji" id="resultEmoji">🏆</div>
    <div class="result-title" id="resultTitle">¡Increíble!</div>
    <div class="result-sub"  id="resultSub">Has completado la ronda</div>
    <div class="result-score" id="resultScore">0 <small>pts</small></div>
    <div class="stars-row" id="starsRow">⭐⭐⭐</div>
    <div class="stat-row">
      <div class="stat"><strong id="statCorrect">0</strong><span>Correctas</span></div>
      <div class="stat"><strong id="statWrong">0</strong><span>Falladas</span></div>
      <div class="stat"><strong id="statStreak">0</strong><span>Racha máx.</span></div>
    </div>
  </div>
  <div class="btn-row">
    <button class="action-btn secondary" onclick="goMenu()">🏠 Menú</button>
    <button class="action-btn primary"   onclick="startGame()">🔄 Otra vez</button>
  </div>
</div>

<script>
const TOTAL_Q = 10;
let state = {
  op: '+', diff: 'easy',
  q: 0, score: 0, correct: 0, wrong: 0, streak: 0, maxStreak: 0,
  answer: 0, inputVal: '', locked: false
};
const diffMax = { easy: 10, medium: 20, hard: 50 };
const messages = {
  correct: ['¡Genial! 🎉','¡Correcto! ⭐','¡Muy bien! 🔥','¡Eso es! 💪','¡Perfecto! 🌟','¡Bravo! 👏'],
  wrong:   ['¡Casi! 😅','Inténtalo 💪','¡Sigue así! 🤗','No pasa nada 😊']
};

function selectOp(btn, op) {
  document.querySelectorAll('.op-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected'); state.op = op;
}
function selectDiff(btn, diff) {
  document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected'); state.diff = diff;
}
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function goMenu() { showScreen('menu'); }

function startGame() {
  Object.assign(state, { q:0, score:0, correct:0, wrong:0, streak:0, maxStreak:0, locked:false });
  showScreen('game'); nextQuestion();
}
function pickOp() {
  if (state.op === 'mix')  return ['+','-','*','/'][Math.floor(Math.random()*4)];
  if (state.op === 'mix2') return Math.random() < 0.5 ? '+' : '-';
  return state.op;
}
function rand(min, max) { return Math.floor(Math.random()*(max-min+1))+min; }

function generateQuestion(op) {
  const max = diffMax[state.diff];
  let a, b, ans, sym;
  switch (op) {
    case '+': a=rand(1,max); b=rand(1,max); ans=a+b; sym='+'; break;
    case '-': a=rand(1,max); b=rand(1,max); if(b>a)[a,b]=[b,a]; ans=a-b; sym='−'; break;
    case '*': { const m=state.diff==='easy'?5:state.diff==='medium'?10:12;
                a=rand(1,m); b=rand(1,m); ans=a*b; sym='×'; break; }
    case '/': { const d=state.diff==='easy'?5:state.diff==='medium'?8:12;
                const k=rand(1,state.diff==='easy'?5:state.diff==='medium'?8:10);
                b=rand(1,d); a=b*k; ans=k; sym='÷'; break; }
  }
  return { a, b, sym, answer: ans };
}

function renderQuestion(a, b, sym) {
  document.getElementById('problemContainer').innerHTML =
    `<div class="v-problem">
      <div class="v-row"><span class="v-spacer"></span><span class="v-num">${a}</span></div>
      <div class="v-row"><span class="v-sym">${sym}</span><span class="v-num">${b}</span></div>
      <div class="v-hline"></div>
      <div class="v-row"><span class="v-spacer"></span><div class="answer-display" id="answerDisplay">_</div></div>
    </div>`;
}

function nextQuestion() {
  if (state.q >= TOTAL_Q) { showResults(); return; }
  state.q++; state.inputVal = ''; state.locked = false;
  const op = pickOp();
  const { a, b, sym, answer } = generateQuestion(op);
  state.answer = answer;
  renderQuestion(a, b, sym);
  document.getElementById('feedbackMsg').textContent = '';
  document.getElementById('okBtn').disabled = false;
  const pct = ((state.q-1)/TOTAL_Q)*100;
  document.getElementById('progressFill').style.width = pct+'%';
  document.getElementById('progressText').textContent = `${state.q} / ${TOTAL_Q}`;
  document.getElementById('scoreBadge').textContent   = `⭐ ${state.score}`;
  updateStreak();
}

function updateStreak() {
  document.getElementById('streakRow').textContent =
    state.streak >= 2 ? '🔥'.repeat(Math.min(state.streak,5)) : '';
}

function numPress(d) {
  if (state.locked || state.inputVal.length >= 5) return;
  state.inputVal += d;
  document.getElementById('answerDisplay').textContent = state.inputVal;
}
function numDel() {
  if (state.locked) return;
  state.inputVal = state.inputVal.slice(0,-1);
  document.getElementById('answerDisplay').textContent = state.inputVal || '_';
}

function checkAnswer() {
  if (state.locked || state.inputVal === '') return;
  state.locked = true;
  document.getElementById('okBtn').disabled = true;
  const correct = parseInt(state.inputVal,10) === state.answer;
  const display  = document.getElementById('answerDisplay');
  const feedback = document.getElementById('feedbackMsg');

  if (correct) {
    state.correct++; state.streak++;
    if (state.streak > state.maxStreak) state.maxStreak = state.streak;
    const bonus = Math.min(state.streak-1,4)*2;
    state.score += 10 + bonus;
    display.classList.add('correct');
    feedback.textContent = messages.correct[Math.floor(Math.random()*messages.correct.length)];
    feedback.style.color = '#27AE60';
    if (bonus > 0) floatPoints(`+${10+bonus}`, display);
    launchConfetti(state.streak >= 3 ? 6 : 3);
  } else {
    state.wrong++; state.streak = 0;
    display.classList.add('wrong');
    feedback.textContent = `La respuesta era ${state.answer}`;
    feedback.style.color = '#E74C3C';
  }
  document.getElementById('scoreBadge').textContent = `⭐ ${state.score}`;
  updateStreak();
  setTimeout(nextQuestion, correct ? 900 : 1400);
}

function showResults() {
  const pct   = state.correct / TOTAL_Q;
  const stars = pct>=0.9?3:pct>=0.6?2:pct>=0.3?1:0;
  const data  = [
    {stars:3,emoji:'🏆',title:'¡Eres un campeón!', sub:'¡Respuestas perfectas!'},
    {stars:2,emoji:'🌟',title:'¡Muy bien hecho!',   sub:'¡Casi lo tienes todo!'},
    {stars:1,emoji:'😊',title:'¡Buen intento!',     sub:'¡Sigue practicando!'},
    {stars:0,emoji:'💪',title:'¡No te rindas!',      sub:'¡La práctica hace al maestro!'},
  ].find(d => d.stars === stars);
  document.getElementById('resultEmoji').textContent  = data.emoji;
  document.getElementById('resultTitle').textContent  = data.title;
  document.getElementById('resultSub').textContent    = data.sub;
  document.getElementById('resultScore').innerHTML    = `${state.score} <small>pts</small>`;
  document.getElementById('starsRow').textContent     = '⭐'.repeat(stars)+'☆'.repeat(3-stars);
  document.getElementById('statCorrect').textContent  = state.correct;
  document.getElementById('statWrong').textContent    = state.wrong;
  document.getElementById('statStreak').textContent   = state.maxStreak;
  if (pct >= 0.9) launchConfetti(20);
  showScreen('results');
}

function floatPoints(text, anchor) {
  const el = document.createElement('div');
  el.className = 'float-pts'; el.textContent = text;
  const r = anchor.getBoundingClientRect();
  el.style.left = (r.left+r.width/2-20)+'px'; el.style.top = r.top+'px';
  document.body.appendChild(el); setTimeout(()=>el.remove(), 900);
}
function launchConfetti(count) {
  const colors = ['#4A90E2','#F1C40F','#27AE60','#E74C3C','#9B59B6','#E67E22'];
  for (let i=0; i<count; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.left              = Math.random()*100+'vw';
    el.style.top               = '-20px';
    el.style.background        = colors[Math.floor(Math.random()*colors.length)];
    el.style.animationDuration = (1.5+Math.random()*1.5)+'s';
    el.style.animationDelay    = (Math.random()*0.5)+'s';
    el.style.borderRadius      = Math.random()>0.5?'50%':'2px';
    document.body.appendChild(el); setTimeout(()=>el.remove(), 3500);
  }
}

document.addEventListener('keydown', e => {
  if (document.getElementById('game').classList.contains('active')) {
    if (e.key>='0'&&e.key<='9') numPress(e.key);
    else if (e.key==='Backspace') numDel();
    else if (e.key==='Enter') checkAnswer();
  }
});

// ── SERVICE WORKER ──
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
</script>
</body>
